name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow azure-functions azure-storage-blob pytest

      - name: Run tests
        run: pytest tests/ -v

  release:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${VERSION}" "${GITHUB_SHA}"
            git push origin "${VERSION}"
          fi

      - name: Build Azure Functions package in staging directory
        run: |
          set -euo pipefail

          STAGE="$(mktemp -d)"
          APP_DIR="$STAGE/app"

          mkdir -p "$APP_DIR"

          cp -a src/. "$APP_DIR/"

          test -f "$APP_DIR/function_app.py"

          # Azure Functions Python package layout:
          # keep application files at ZIP root and place dependencies under
          # .python_packages/lib/site-packages for Linux zip deployment.
          mkdir -p "$APP_DIR/.python_packages/lib/site-packages"

          python -m pip install --upgrade pip

          pip install \
            --target "$APP_DIR/.python_packages/lib/site-packages" \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            --upgrade \
            -r requirements.txt

          if [ ! -f "$APP_DIR/host.json" ]; then
            echo "ERROR: src/host.json is missing from the repository."
            exit 1
          fi

          ZIP_NAME="thumbnail-function-${VERSION}.zip"

          (
            cd "$APP_DIR"

            find . -type d -name "__pycache__" -prune -exec rm -rf {} +
            find . -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete

            zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" . \
              -x "*/__pycache__/*" \
              -x "*.pyc" \
              -x "*.pyo"
          )

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Verify package structure
        run: |
          set -euo pipefail

          unzip -l "$ZIP_NAME"

          unzip -l "$ZIP_NAME" | awk '{print $4}' | grep -Fx "host.json"
          unzip -l "$ZIP_NAME" | awk '{print $4}' | grep -Fx "function_app.py"

          echo "Archive size:"
          ls -lh "$ZIP_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ${{ env.ZIP_NAME }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}

      - name: Print Azure deployment command
        run: |
          echo "az functionapp deployment source config-zip \\"
          echo "  --resource-group <RESOURCE_GROUP> \\"
          echo "  --name <FUNCTION_APP_NAME> \\"
          echo "  --src ${ZIP_NAME}"
