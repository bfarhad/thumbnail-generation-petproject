name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.1.0). Leave empty to auto-generate."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # same pinned versions that ship in the release zip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      INPUT_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            PRERELEASE=false
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ -n "${INPUT_VERSION:-}" ]]; then
              VERSION="${INPUT_VERSION}"
            else
              VERSION="v0.1.${GITHUB_RUN_NUMBER}"
            fi
            PRERELEASE=false
          else
            VERSION="v0.1.${GITHUB_RUN_NUMBER}"
            PRERELEASE=true
          fi

          # Validate BEFORE exporting: a crafted manual input (e.g. with a newline)
          # must never reach GITHUB_ENV.
          if ! [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]]; then
            echo "ERROR: invalid version '${VERSION}' (expected e.g. v0.1.0)" >&2
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "PRERELEASE=${PRERELEASE}" >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build Azure Functions package in staging directory
        run: |
          set -euo pipefail

          STAGE="$(mktemp -d)"
          APP_DIR="$STAGE/app"

          mkdir -p "$APP_DIR"

          cp -a src/. "$APP_DIR/"

          test -f "$APP_DIR/function_app.py"

          mkdir -p "$APP_DIR/.python_packages/lib/site-packages"

          python -m pip install --upgrade pip

          pip install \
            --target "$APP_DIR/.python_packages/lib/site-packages" \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            --upgrade \
            -r requirements.txt

          if [ ! -f "$APP_DIR/host.json" ]; then
            echo "ERROR: src/host.json is missing from the repository."
            exit 1
          fi

          ZIP_NAME="thumbnail-function-${VERSION}.zip"

          (
            cd "$APP_DIR"

            find . -type d -name "__pycache__" -prune -exec rm -rf {} +
            find . -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete

            zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" . \
              -x "*/__pycache__/*" \
              -x "*.pyc" \
              -x "*.pyo"
          )

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Verify package structure
        run: |
          set -euo pipefail

          unzip -l "$ZIP_NAME"
          unzip -l "$ZIP_NAME" | awk '{print $4}' | grep -Fx "host.json"
          unzip -l "$ZIP_NAME" | awk '{print $4}' | grep -Fx "function_app.py"

          echo "Archive size:"
          ls -lh "$ZIP_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ${{ env.ZIP_NAME }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE }}
          files: ${{ env.ZIP_NAME }}

      - name: Print Azure deployment command
        run: |
          echo "az functionapp deployment source config-zip \\"
          echo "  --resource-group <RESOURCE_GROUP> \\"
          echo "  --name <FUNCTION_APP_NAME> \\"
          echo "  --src ${ZIP_NAME}"
